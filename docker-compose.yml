services:
  gtm_advisor-postgres:
    image: postgres:16
    container_name: gtm_advisor-postgres
    restart: unless-stopped
    env_file:
      - infra/.env
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - ./docker-data/gtm_advisor-postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  gtm_advisor:
    build: .
    container_name: gtm_advisor
    image: gtm_advisor:latest
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_BIND_PORT:-8011}:8011"
    restart: unless-stopped
    depends_on:
      gtm_advisor-postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    env_file:
      - infra/.env
    environment:
      GTM_ADVISOR_SOURCES: /app/data/sources.csv
      GTM_ADVISOR_LOAD_CONFIG: /app/data/load_config.csv
      GTM_ADVISOR_SCRAPING_CONFIG: /app/data/scraping_config.json
      GTM_ADVISOR_DB_PATH: /app/data/gtm_advisor.db
      GTM_ADVISOR_OUTPUT_DIR: /app/outputs
      POSTGRES_HOST: gtm_advisor-postgres
      POSTGRES_PORT: "5432"
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8011/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp

  ollama:
    image: ollama/ollama:latest
    container_name: gtm_advisor-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - gtm_advisor_ollama:/root/.ollama
  caddy:
    image: caddy:2
    container_name: gtm_advisor-caddy
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      gtm_advisor:
        condition: service_healthy
    env_file:
      - infra/.env
    ports:
      - "${GTM_ADVISOR_BIND_IP:-0.0.0.0}:80:80"
      - "${GTM_ADVISOR_BIND_IP:-0.0.0.0}:443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - gtm_advisor_caddy_data:/data
      - gtm_advisor_caddy_config:/config

volumes:
  gtm_advisor_caddy_data:
  gtm_advisor_caddy_config:
  gtm_advisor_ollama:
