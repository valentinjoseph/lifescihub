<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Life Science Watch Viewer Access</title>
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
  <main class="page-shell">
    <section class="hero">
      <div>
        <p class="eyebrow">Life Science Watch</p>
        <h1>Viewer Access</h1>
        <p class="subtitle">Enter the viewer token to open the read-only dashboard and chat experience.</p>
      </div>
    </section>

    <section class="panel" style="max-width: 520px;">
      <div class="panel-head">
        <h2>Sign In</h2>
        <p>The viewer token is never sent in the URL.</p>
      </div>
      <form method="post" action="/viewer">
        <label for="access_token">
          <span>Viewer Token</span>
          <input id="access_token" name="access_token" type="password" autocomplete="off" required>
        </label>
        <div class="chat-actions">
          <button class="primary" type="submit">Open Dashboard</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
