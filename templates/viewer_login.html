<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Life Science Watch Viewer Access</title>
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
  <main class="page-shell">
    <section class="hero">
      <div>
        <p class="eyebrow">Life Science Watch</p>
        <h1>Viewer Access</h1>
        <p class="subtitle">Sign in to open the read-only dashboard and chat experience.</p>
      </div>
    </section>

    <section class="panel" style="max-width: 520px;">
      <div class="panel-head">
        <h2>Sign In</h2>
        <p>Viewer credentials are exchanged for a secure dashboard cookie.</p>
      </div>
      <form method="post" action="/viewer">
        <label for="username">
          <span>Username</span>
          <input id="username" name="username" type="text" autocomplete="username" value="guest" required>
        </label>
        <label for="password">
          <span>Password</span>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <div class="chat-actions">
          <button class="primary" type="submit">Open Dashboard</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
